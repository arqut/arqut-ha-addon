name: Arqut Edge EE
description: Arqut Edge Enterprise Edition — Secure Tunnel Service for Home Assistant, powered by WireGuard & WebRTC
version: v0.13.0
slug: arqut-edge-ee
init: false
url: https://github.com/arqut/arqut-ha-addon
codenotary: tuan.phan267@gmail.com
webui: http://[HOST]:[PORT:3030]
image: ghcr.io/arqut/arqut-edge-ee-ha-addon-{arch}
arch:
  - aarch64
  - amd64
  - armv7
  - i386
map:
  - type: homeassistant_config
    read_only: False
    path: /haconfig
startup: services
host_network: true
# Lets the add-on register itself as a trusted proxy through Core's websocket
# API, which is the only way to set that from Home Assistant 2026.8 on.
homeassistant_api: true
privileged:
  - NET_ADMIN
ports:
  3030/tcp: 3030
ports_description:
  3030/tcp: Used for web interface and API
options:
  data_dir: "/data"
  log_level: info
schema:
  data_dir: str
  log_level: list(error|warn|info|debug)
